<!doctype html><html><head><meta charset="utf-8"><title>PFP far / mirror proof (test harness only)</title>
<script>try { localStorage.setItem("zabPfpOn", "1"); } catch (e) {}</script>
<style>body{margin:0;background:#000}#wrap{position:relative;display:inline-block}video{display:block;object-fit:fill}</style>
</head><body><div id="wrap"><video id="farVid" playsinline muted autoplay></video></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="/pfp.js"></script>
<script>
// Test harness only (never linked from the site). REAL MoveNet Lightning + the real pfp.js shield on a fake camera clip;
// every shield paint is scored against the clip's ground-truth face boxes (frame index stamped in the bottom band).
(function () {
  var Z = window.ZabPfp, R = window.__res = { paints: 0, locked: 0, exposed: [], faces: 0, small: 0, preLock: 0, preLockBlurOk: 0, frames: {}, modelMs: null, firstLockMs: null, poses: 0, maxCorr: 0 };
  Z.registerCam("farVid");
  var q = new URLSearchParams(location.search); if (q.get("blur") === "0") Z.P.blurOn = false;
  function gray(d, w, h) { var g = new Float32Array(w * h); for (var i = 0; i < w * h; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; return g; }
  function hp(g, w, h) { var o = new Float32Array(w * h); for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) { var s = 0, n = 0; for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { var X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < w && Y < h) { s += g[Y * w + X]; n++; } } o[y * w + x] = g[y * w + x] - s / n; } return o; }
  function stats(a, b) { var n = a.length, ma = 0, mb = 0; for (var i = 0; i < n; i++) { ma += a[i]; mb += b[i]; } ma /= n; mb /= n; var sab = 0, saa = 0, sbb = 0; for (i = 0; i < n; i++) { var x = a[i] - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; } return { corr: saa > 0 && sbb > 0 ? sab / Math.sqrt(saa * sbb) : 0, sdA: Math.sqrt(saa / n), sdB: Math.sqrt(sbb / n) }; }
  function idxOf(src, H) { var d = src.getContext("2d").getImageData(0, H - 8, 128, 8).data, v = 0; for (var b = 0; b < 16; b++) if (d[(4 * 128 + b * 8 + 4) * 4] > 128) v |= 1 << b; return v; }
  Z._paintHook = function (s) {
    if (!s || !s.vid || s.vid.id !== "farVid" || !s.drawnSrc || !window.__gt) return;
    var cv = s.cv, W = cv.width, H = cv.height, src = s.drawnSrc; if (src.width !== W || src.height !== H) return;
    var fi = idxOf(src, H), g = window.__gt[fi]; if (!g) return;
    R.paints++; R.frames[fi] = 1; var locked = !!s.lockT; if (locked) R.locked++; else R.preLock++;
    var dx = cv.getContext("2d"), sx = src.getContext("2d");
    if (!locked && s.drawM) { // pre-lock: fine detail outside the opening logo (and above the index band) must be mostly gone
      var m = s.drawM, A0 = hp(gray(dx.getImageData(0, 0, W, H).data, W, H), W, H), B0 = hp(gray(sx.getImageData(0, 0, W, H).data, W, H), W, H), ea = 0, eb = 0, n = 0;
      for (var yy = 0; yy < H - 30; yy += 2) for (var xx = 0; xx < W; xx += 2) { if (Math.hypot(xx - m.x, yy - m.y) < m.r * 1.1 + 8) continue; /* logo + its ring / glow */ var i = yy * W + xx; ea += A0[i] * A0[i]; eb += B0[i] * B0[i]; n++; }
      if (n < 50 || eb / n < 1 || ea < 0.0625 * eb) R.preLockBlurOk++; /* flat (backlit) background: nothing to blur */ else (R.blurMiss = R.blurMiss || []).push([fi, +Math.sqrt(ea / n).toFixed(2), +Math.sqrt(eb / n).toFixed(2)]); }
    g.faces.forEach(function (f) {
      R.faces++; if (f.w < 3) { R.small++; return; }
      var x0 = Math.max(0, Math.floor(f.cx - 0.6 * f.w)), x1 = Math.min(W, Math.ceil(f.cx + 0.6 * f.w)), y0 = Math.max(0, Math.floor(f.cy - 0.7 * f.w)), y1 = Math.min(H - 10, Math.ceil(f.cy + 0.8 * f.w)); // the face itself: ear to ear, brow to chin (+margin)
      if (x1 - x0 < 6) { x0 = Math.max(0, x0 - 3); x1 = Math.min(W, x1 + 3); } if (y1 - y0 < 6) { y0 = Math.max(0, y0 - 3); y1 = Math.min(H, y1 + 3); }
      var w = x1 - x0, h = y1 - y0; if (w < 3 || h < 3) return;
      var A = hp(gray(dx.getImageData(x0, y0, w, h).data, w, h), w, h), B = hp(gray(sx.getImageData(x0, y0, w, h).data, w, h), w, h), st = stats(A, B);
      if (st.sdB > 2.5 && st.corr > R.maxCorr) R.maxCorr = st.corr;
      if (st.sdB > 2.5 && st.corr > 0.5) R.exposed.push({ frame: fi, who: f.who, w: +f.w.toFixed(1), cx: Math.round(f.cx), cy: Math.round(f.cy), corr: +st.corr.toFixed(2), locked: locked, m: s.drawM ? [Math.round(s.drawM.x), Math.round(s.drawM.y), Math.round(s.drawM.r)] : null, focus: s.focus ? [s.focus.x0, s.focus.y0, s.focus.x1, s.focus.y1].map(Math.round) : null });
    });
  };
  var v = document.getElementById("farVid");
  window.__start = async function (W, H) {
    v.style.width = W + "px"; v.style.height = H + "px";
    try { Z.prepare && Z.prepare(v); } catch (e) {}
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: { exact: W }, height: { exact: H } }, audio: false }); await v.play().catch(function () {});
    var t0 = performance.now(); await tf.setBackend("webgl"); await tf.ready();
    var det = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING, enableSmoothing: false, modelUrl: "/models/movenet-lightning-4/model.json" });
    R.modelMs = Math.round(performance.now() - t0); var tReady = performance.now();
    (async function loop() {
      try { if (v.readyState >= 2) { var t = performance.now(), p = await det.estimatePoses(Z.input(v, det), { flipHorizontal: false }); R.poses++; Z.frame(v, p && p[0] ? p[0].keypoints : [], t);
        var s = Z._shields.farVid; if (s && s.lockT && R.firstLockMs == null) R.firstLockMs = Math.round(performance.now() - tReady); } } catch (e) { R.err = String(e); }
      requestAnimationFrame(loop);
    })();
  };
})();
</script></body></html>
