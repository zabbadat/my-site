# The Firebase web apiKey in index.html is public by design (it only identifies the
# project; access is enforced by Firestore rules). Tell Netlify's smart secret
# detection to ignore it so builds don't fail. The real secret
# (FIREBASE_SERVICE_ACCOUNT) is only a Netlify env var, never in the repo.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAFUns8hTulLfXvgvL4enUWRjwZCqUWqY4,918223497843-85hu45udu6orsllnmnj1n5k8tc6l9os1.apps.googleusercontent.com"

# wager-sweep settles / refunds open ZAB wagers nobody settled (silent players, rooms that never started).
# Legacy (CommonJS) functions ignore `exports.config`, so the cron schedule must be declared here (UTC).
[functions."wager-sweep"]
  schedule = "*/5 * * * *"

# Firebase Auth helper, same origin as the site (Safari 16.1+ / storage partitioning).
# signInWithRedirect loads /__/auth/handler from authDomain. That helper must be served here,
# not by a 301/302 to zabbadat-5f132.firebaseapp.com, or sessionStorage is blocked and Google
# sign-in dies with "missing initial state". status 200 is Netlify's transparent reverse proxy.
# https://firebase.google.com/docs/auth/web/redirect-best-practices (option 3).
[[redirects]]
  from = "/__/auth/*"
  to = "https://zabbadat-5f132.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Phone Google sign-in: Google form_posts the sign-in credential to the
# already-authorized handler. This function exchanges it for a Firebase session.
# Other handler traffic is still proxied to Firebase.
[[edge_functions]]
  function = "google-credential"
  path = "/__/auth/handler"

# If Google posts the phone credential to / instead of the handler, hand it
# to the homepage hash. Every other request continues to the site.
[[edge_functions]]
  function = "home-google-post"
  path = "/"
