[build]
  # Publish only the static site (not node_modules / function sources).
  command = "rm -rf dist && mkdir dist && cp *.html *.js *.png *.txt *.xml dist/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "node_modules/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
